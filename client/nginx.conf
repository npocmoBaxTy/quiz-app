server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # SPA на react-router: любой неизвестный путь отдаём index.html,
  # иначе перезагрузка страницы на /quiz/123 вернёт 404.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Хэшированные ассеты Vite неизменяемы — кэшируем надолго
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # index.html кэшировать нельзя, иначе клиенты останутся на старом бандле
  location = /index.html {
    add_header Cache-Control "no-cache";
  }

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;
}
