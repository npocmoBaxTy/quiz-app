services:
  server:
    build:
      context: ..
      dockerfile: docker/server.Dockerfile
    env_file:
      - ../server/.env
    environment:
      NODE_ENV: production
      PORT: 5000
      TRUST_PROXY: 1
      RUN_MIGRATIONS: "true"
    ports:
      - "5000:5000"
    volumes:
      - uploads:/app/uploads
    restart: unless-stopped

  client:
    build:
      context: ../client
      dockerfile: ../docker/client.Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:5000}
    ports:
      - "8080:80"
    depends_on:
      - server
    restart: unless-stopped

volumes:
  uploads:
